
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Operator Pengelola Data - Masa Depan</title>
<style>
  body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 2em;
    color: #00ffe8;
  }
  .container {
    max-width: 1000px;
    margin: auto;
    background: rgba(0,0,0,0.3);
    border-radius: 15px;
    padding: 20px;
  }
  form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  input, select, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 1em;
  }
  input[type="number"] {
    width: 150px;
  }
  button {
    background-color: #00ffe8;
    color: #000;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    background-color: #00c9d6;
  }
  #dataTable {
    width: 100%;
    border-collapse: collapse;
  }
  #dataTable th, #dataTable td {
    padding: 12px;
    border: 1px solid #00ffe8;
    text-align: center;
  }
  #dataTable th {
    background-color: #00ffea;
    color: #000;
  }
  .no-data {
    text-align: center;
    padding: 20px;
    font-style: italic;
  }
  /* Tambahan styling untuk total */
  .totals {
    margin-top: 20px;
    padding: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
  }
  .totals h3 {
    margin: 5px 0;
  }
</style>
</head>
<body>
<h1>Operator Pengelola Data - Masa Depan</h1>
<div class="container">

<h2>Input Data Baru</h2>
<form id="dataForm">
  <select id="type">
    <option value="pengeluaran">Pengeluaran</option>
    <option value="pemasukan">Pemasukan</option>
  </select>
  <input type="number" id="amount" placeholder="Jumlah" required />
  <button type="submit">Tambah Data</button>
</form>

<h2>Daftar Data</h2>
<div id="tableContainer">
  <table id="dataTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Jenis</th>
        <th>Jumlah</th>
        <th>Tanggal</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="dataBody">
      <tr class="no-data"><td colspan="5">Data kosong</td></tr>
    </tbody>
  </table>
</div>

<div class="totals">
  <h3>Total Pemasukan: Rp <span id="totalPemasukan">0</span></h3>
  <h3>Total Pengeluaran: Rp <span id="totalPengeluaran">0</span></h3>
  <h3>Saldo Bersih: Rp <span id="saldo">0</span></h3>
</div>

</div>

<script>
  // Menggunakan Local Storage sebagai database
  let dataList = JSON.parse(localStorage.getItem('keuanganData')) || [];
  let idCounter = dataList.length > 0 ? Math.max(...dataList.map(d => d.id)) + 1 : 1;

  const dataForm = document.getElementById('dataForm');
  const dataBody = document.getElementById('dataBody');
  const totalPemasukanSpan = document.getElementById('totalPemasukan');
  const totalPengeluaranSpan = document.getElementById('totalPengeluaran');
  const saldoSpan = document.getElementById('saldo');

  // Fungsi render tabel dan update totals
 function renderTable() {
    dataBody.innerHTML = '';
    if (dataList.length === 0) {
      dataBody.innerHTML = '<tr class="no-data"><td colspan="5">Data kosong</td></tr>';
    } else {
      dataList.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.id}</td>
          <td>${item.type}</td>
          <td>Rp ${item.amount.toLocaleString()}</td>
          <td>${item.date}</td>
          <td><button onclick="hapusData(${item.id})">Hapus</button></td>
        `;
        dataBody.appendChild(row);
      });
    }
    updateTotals();
  }

  // Fungsi update total pemasukan, pengeluaran, dan saldo
 function updateTotals() {
    let totalPemasukan = 0;
    let totalPengeluaran = 0;

    dataList.forEach(item => {
      if (item.type === 'pemasukan') {
        totalPemasukan += item.amount;
      } else {
        totalPengeluaran += item.amount;
      }
    });

    const saldo = totalPemasukan - totalPengeluaran;
    totalPemasukanSpan.innerText = totalPemasukan.toLocaleString();
    totalPengeluaranSpan.innerText = totalPengeluaran.toLocaleString();
    saldoSpan.innerText = saldo.toLocaleString();
  }

 // Fungsi tambah data
 dataForm.onsubmit = function(e) {
    e.preventDefault();
    const type = document.getElementById('type').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const date = new Date().toLocaleString();

    const newData = { id: idCounter++, type, amount, date };
    dataList.push(newData);
    localStorage.setItem('keuanganData', JSON.stringify(dataList));
    renderTable();
    dataForm.reset();
  }

 // Fungsi hapus data
 function hapusData(id) {
    dataList = dataList.filter(item => item.id !== id);
    localStorage.setItem('keuanganData', JSON.stringify(dataList));
    renderTable();
  }

 // Inisialisasi tabel saat halaman load
 window.onload = function() {
    renderTable();
  }
</script>

<!-- Link font futuristik -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

</body>
</html>
